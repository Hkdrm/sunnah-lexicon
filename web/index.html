<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexique de la Sunnah</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sunnah">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f2f2f7;--card:#fff;--fg:#000;--muted:#6c6c70;--line:rgba(60,60,67,.16);--fill:rgba(118,118,128,.12);--accent:#1d7a56;--accent-soft:rgba(29,122,86,.12);--warn:#b25e00;--warn-soft:rgba(178,94,0,.12);--bar:rgba(249,249,249,.86);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--fg:#fff;--muted:#98989f;--line:rgba(84,84,88,.55);--fill:rgba(118,118,128,.24);--accent:#34c48b;--accent-soft:rgba(52,196,139,.16);--warn:#ff9f0a;--warn-soft:rgba(255,159,10,.16);--bar:rgba(29,29,31,.86);color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
#screen{max-width:640px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px 24px}
.enter{animation:enter .22s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}
h1.large{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:.2px;margin:10px 0 12px}
.lead{color:var(--muted);font-size:15px;margin:-4px 0 14px}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;margin:0 0 6px}
.search svg{flex:none;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:17px;outline:none;height:100%}
.search input::placeholder{color:var(--muted)}
.section{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:24px 16px 6px}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 16px;border:0;border-top:.5px solid var(--line);background:none;width:100%;text-align:left;color:var(--fg);font:inherit;cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--fill)}
.row .t{flex:1;min-width:0}
.row .chev{flex:none;color:var(--muted);opacity:.6}
.row .sub{display:block;font-size:14px;color:var(--muted)}
.row select{border:0;background:none;color:var(--accent);font:inherit;font-size:16px;max-width:60%;text-align:right;text-align-last:right;outline:none}
.seg{display:flex;gap:6px;overflow-x:auto;margin:6px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:var(--fill);color:var(--fg);padding:7px 14px;border-radius:99px;font:inherit;font-size:15px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.nav{display:flex;align-items:center;margin:2px -6px 4px}
.back{display:flex;align-items:center;gap:2px;border:0;background:none;color:var(--accent);font:inherit;padding:8px 6px;cursor:pointer}
h1.detail{font-size:28px;line-height:1.15;font-weight:700;margin:4px 0 12px}
.card{background:var(--card);border-radius:14px;padding:16px;margin:0 0 12px}
.card p{margin:0}
.fr{font-size:17px;line-height:1.45}
.ar{font-size:22px;line-height:2;direction:rtl;text-align:right;font-family:"SF Arabic","Geeza Pro","Noto Naskh Arabic","Amiri",serif;margin:12px 0 0;padding:10px 12px;background:var(--fill);border-radius:10px}
.fr+.ar{margin-top:12px}
.ref{font-size:13px;color:var(--muted);margin:0 0 8px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;align-items:center}
.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0}
.note.warn{color:var(--warn)}
.link{font-size:14px;color:var(--accent);text-decoration:none}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.more{display:block;width:100%;border:0;background:var(--card);color:var(--accent);font:inherit;padding:14px;border-radius:12px;margin:8px 0;cursor:pointer}
.info h2{font-size:20px;margin:22px 0 6px}
.info p,.info li{color:var(--fg);font-size:16px}
.info ul{padding-left:20px;margin:6px 0}
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
#tabbar .in{display:flex;width:100%;max-width:640px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:7px 0 6px;color:var(--muted);font:inherit;font-size:10.5px;cursor:pointer}
.tab[aria-current=page]{color:var(--accent)}
.tab svg{width:26px;height:26px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:8px}
.tile{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:124px;padding:14px;border:0;border-radius:18px;background:var(--card);color:var(--fg);font:inherit;text-align:left;cursor:pointer;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:23px;height:23px}
.tile b{display:block;font-size:17px;line-height:1.2;font-weight:600}
.tile span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
a{color:var(--accent)}
</style>
</head>
<body>
<main id="screen"></main>
<nav id="tabbar" aria-label="Navigation"><div class="in">
 <button class="tab" data-go="#/" id="t-home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>Pratiques</button>
 <button class="tab" data-go="#/h" id="t-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5c2.5-1.5 5.5-1.5 8 0V19c-2.5-1.5-5.5-1.5-8 0-2.5-1.5-5.5-1.5-8 0z"/><path d="M12 5.5V19"/></svg>Hadiths</button>
 <button class="tab" data-go="#/i" id="t-i"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="1" fill="currentColor"/></svg>Infos</button>
</div></nav>
<script>

const $ = (s, r=document) => r.querySelector(s);
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* --- Arabe : normalisation + radical léger (doit rester identique à scripts/arabic.py) --- */
const arNorm = s => (s||"").replace(/[ً-ٰٟـۖ-ۭ]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي");
const arTokens = s => arNorm(s).match(/[ء-ي]+/g) || [];
const PREFIXES = ["وبال","وال","فال","بال","كال","لل","ال"];
function stem(w){
  for (const p of PREFIXES) if (w.startsWith(p) && w.length - p.length >= 3) { w = w.slice(p.length); break; }
  if (w.endsWith("ات") && w.length >= 4) w = w.slice(0,-2) + "ة";
  else for (const suf of ["ون","ين","ان","ها","هم","هن","كم","نا"])
    if (w.endsWith(suf) && w.length - suf.length >= 3) { w = w.slice(0,-suf.length); break; }
  return w;
}
const frNorm = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const isAr = s => /[؀-ۿ]/.test(s);
const ICON_SEARCH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
const CHEV = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const BACK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

const CAT = {
 "repas":{c:"#ff9500",i:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'},
 "priere-hygiene":{c:"#0a84ff",i:'<path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/>'},
 "sommeil":{c:"#5e5ce6",i:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>'},
 "relations":{c:"#ff375f",i:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'},
 "maison-voyage":{c:"#30b0c7",i:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/>'},
 "jeune":{c:"#af52de",i:'<path d="M3 18h18M6 18a6 6 0 0 1 12 0M12 5v3M5 9l2 2M19 9l-2 2"/>'},
 "caractere":{c:"#34c759",i:'<path d="M12 3l2.6 5.6 6 .8-4.4 4.2 1.1 6L12 16.8 6.7 19.6l1.1-6L3.4 9.4l6-.8z"/>'}
};
const catIcon = slug => { const k = CAT[slug] || {c:"#8e8e93",i:'<circle cx="12" cy="12" r="8"/>'}; return `<span class="ic" style="background:${k.c}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${k.i}</svg></span>`; };
let D, byKey, state = {q:"", hq:"", col:"", theme:"", sit:"", term:"", limit:30};
const scrolls = {};

/* --- Matching --- */
function matches(h, tokens){
  return tokens.every(t => {
    if (isAr(t)) return h._ar.includes(arNorm(t)) || arTokens(t).every(x => h._stems.has(stem(x)));
    return h._fr.includes(frNorm(t)) || String(h.number) === t;
  });
}

/* --- Carte hadith --- */
function hadithCard(h, opts={}){
  const col = D.collections.find(c=>c.slug===h.collection);
  const good = h.grades.length && /sahih|hasan/i.test(h.grades[0].grade);
  const gradeHtml = h.grades.length
    ? `<span class="pill ${good?'':'warn'}">${esc(h.grades[0].grade)}</span>`
    : `<span class="pill warn">Degré non renseigné</span>`;
  const basis = h.grades.length ? `<p class="note">${esc(h.grades.map(g=>g.basis).join(" · "))}</p>` : "";
  const frNote = h.french
    ? (h.french_origin === "jeu de données" ? "" : `<p class="note warn">${esc(h.french_origin)}</p>`)
    : `<p class="note">Traduction française non disponible pour ce hadith.</p>`;
  return `<article class="card">
    <p class="ref">${esc(col.name_fr)} · n° ${h.number}</p>
    ${h.french ? `<p class="fr">${esc(h.french)}</p>` : ""}
    <div class="ar" lang="ar">${esc(h.arabic)}</div>
    ${frNote}
    <div class="pills">${gradeHtml}${h.takhrij ? `<span class="note" style="margin:0">Rapporté par : ${esc(h.takhrij)}</span>` : ""}</div>
    ${basis}
    ${col.note ? `<p class="note warn">⚠ ${esc(col.note)}</p>` : ""}
    <p class="note"><a class="link" href="${h.verify_url || col.site_url}" target="_blank" rel="noopener">${h.verify_url ? "Vérifier" : "Voir le recueil"} sur sunnah.com</a></p>
  </article>`;
}

/* --- Écran : Pratiques (accueil) --- */
function screenHome(el){
  el.innerHTML = `<h1 class="large">Pratiques</h1>
    <p class="lead">Choisissez un thème pour découvrir les gestes de la Sunnah et les hadiths qui les rapportent.</p>
    <label class="search">${ICON_SEARCH}<input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Rechercher un geste" autocomplete="off" aria-label="Rechercher un geste"></label>
    <div id="out"></div>`;
  const q = $("#q", el); q.value = state.q;
  const draw = () => {
    state.q = q.value;
    const tokens = state.q.trim().split(/\s+/).filter(Boolean);
    let html = "", n = 0;
    for (const cat of D.practice_categories) {
      const items = D.practices.filter(p => p.category === cat.slug && (!tokens.length || tokens.every(t =>
        isAr(t) ? p.refs.some(r => { const h = byKey.get(r[0]+":"+r[1]); return h && matches(h, [t]); })
                : (frNorm(p.title_fr)+" "+frNorm(p.summary_fr)+" "+frNorm(cat.label_fr)).includes(frNorm(t)))));
      if (!items.length) continue; n += items.length;
      html += `<div class="section">${esc(cat.label_fr)}</div><div class="group">` +
        items.map(p => `<button class="row" data-go="#/p/${p.slug}"><span class="t">${esc(p.title_fr)}</span>${CHEV}</button>`).join("") + `</div>`;
    }
    if (!tokens.length) {
      $("#out", el).innerHTML = `<div class="grid">` + D.practice_categories.map(c => {
        const k = D.practices.filter(p => p.category === c.slug).length;
        return `<button class="tile" data-go="#/c/${c.slug}">${catIcon(c.slug)}<div><b>${esc(c.label_fr)}</b><span>${k} geste${k>1?"s":""}</span></div></button>`;
      }).join("") + `</div>`;
      return;
    }
    $("#out", el).innerHTML = n ? html : `<div class="empty">Aucun geste trouvé.<br>Essayez l'onglet Hadiths pour chercher dans les textes.</div>`;
  };
  q.addEventListener("input", draw); draw();
}

/* --- Écran : une catégorie --- */
function screenCategory(el, slug){
  const cat = D.practice_categories.find(c=>c.slug===slug);
  if (!cat) { location.hash = "#/"; return; }
  const items = D.practices.filter(p => p.category === slug);
  el.innerHTML = `<div class="nav"><button class="back" data-back>${BACK} Pratiques</button></div>
    <h1 class="detail" style="display:flex;align-items:center;gap:12px">${catIcon(slug)}<span>${esc(cat.label_fr)}</span></h1>
    <div class="group">${items.map(p => `<button class="row" data-go="#/p/${p.slug}"><span class="t">${esc(p.title_fr)}</span>${CHEV}</button>`).join("")}</div>`;
}

/* --- Écran : détail d'une pratique --- */
function screenPractice(el, slug){
  const p = D.practices.find(x=>x.slug===slug);
  if (!p) { location.hash = "#/"; return; }
  el.innerHTML = `<div class="nav"><button class="back" data-back>${BACK} ${esc((D.practice_categories.find(c=>c.slug===p.category)||{}).label_fr || "Pratiques")}</button></div>
    <h1 class="detail">${esc(p.title_fr)}</h1>
    <div class="card"><p class="fr">${esc(p.summary_fr)}</p><p class="note warn">Résumé en cours de relecture. Cette application ne rend pas d'avis juridique.</p></div>
    <div class="section">Sources (${p.refs.length})</div>
    ${p.refs.map(r=>byKey.get(r[0]+":"+r[1])).filter(Boolean).map(h=>hadithCard(h)).join("")}`;
}

/* --- Écran : Hadiths --- */
function screenHadiths(el){
  const opt = (list, cur, all, lab) => `<option value="">${all}</option>` + list.map(x=>`<option value="${x.slug}" ${x.slug===cur?"selected":""}>${esc(lab(x))}</option>`).join("");
  el.innerHTML = `<h1 class="large">Hadiths</h1>
    <label class="search">${ICON_SEARCH}<input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="Français ou arabe : colère, النية" autocomplete="off" aria-label="Rechercher dans les hadiths"></label>
    <div class="seg" id="seg"></div>
    <div class="section">Filtres</div>
    <div class="group">
      <label class="row"><span class="t">Thème</span><select id="f-theme"></select></label>
      <label class="row"><span class="t">Situation</span><select id="f-sit"></select></label>
      <label class="row"><span class="t">Terme</span><select id="f-term"></select></label>
    </div>
    <div id="termbox"></div><div id="count" class="section"></div><div id="list"></div>`;
  const q = $("#q", el); q.value = state.hq;
  const used = k => new Set(D.hadiths.filter(h=>!state.col||h.collection===state.col).flatMap(h=>h[k]));
  const drawSeg = () => {
    $("#seg", el).innerHTML = [{slug:"",name:"Tous"}].concat(D.collections.map(c=>({slug:c.slug,name:c.name_fr.replace(/ \(.*/,"").replace("Les 40 hadiths d'An-Nawawi","Nawawi 40").replace("Ash-Shama'il al-Muhammadiyya","Shama'il").replace("Al-Adab al-Mufrad","Adab al-Mufrad").replace("Riyad as-Salihin","Riyad as-Salihin")})))
      .map(c=>`<button data-col="${c.slug}" aria-pressed="${state.col===c.slug}">${esc(c.name)}</button>`).join("");
    const ut = used("themes"), us = used("situations");
    if (state.theme && !ut.has(state.theme)) state.theme = "";
    if (state.sit && !us.has(state.sit)) state.sit = "";
    $("#f-theme", el).innerHTML = opt(D.themes.filter(t=>ut.has(t.slug)), state.theme, "Tous", t=>t.label_fr);
    $("#f-sit", el).innerHTML = opt(D.situations.filter(t=>us.has(t.slug)), state.sit, "Toutes", t=>t.label_fr);
    $("#f-term", el).innerHTML = opt(D.terms, state.term, "Tous", t=>`${t.translit} · ${t.arabic}`);
  };
  const draw = () => {
    state.hq = q.value;
    const tokens = state.hq.trim().split(/\s+/).filter(Boolean);
    const res = D.hadiths.filter(h => (!state.col||h.collection===state.col) && (!state.theme||h.themes.includes(state.theme)) &&
      (!state.sit||h.situations.includes(state.sit)) && (!state.term||h.terms.includes(state.term)) && (!tokens.length||matches(h,tokens)));
    const t = D.terms.find(x=>x.slug===state.term);
    $("#termbox", el).innerHTML = t ? `<div class="section">Lexique</div><div class="card"><p class="fr"><b>${esc(t.translit)}</b> · <span lang="ar">${t.arabic}</span></p><p>${esc(t.definition_fr)}</p><p class="note warn">Définition en cours de relecture. Liens avec les hadiths : détection automatique, à vérifier.</p></div>` : "";
    $("#count", el).textContent = `${res.length} hadith${res.length>1?"s":""}`;
    $("#list", el).innerHTML = (res.length ? res.slice(0,state.limit).map(h=>hadithCard(h)).join("") : `<div class="empty">Aucun résultat.</div>`) +
      (res.length > state.limit ? `<button class="more" data-more>Afficher plus (${res.length-state.limit})</button>` : "");
  };
  drawSeg(); draw();
  q.addEventListener("input", ()=>{state.limit=30; draw();});
  el.addEventListener("click", e => {
    const b = e.target.closest("[data-col]"); if (b){ state.col=b.dataset.col; state.limit=30; drawSeg(); draw(); }
    if (e.target.closest("[data-more]")) { state.limit += 30; draw(); }
  });
  $("#f-theme", el).onchange = e => { state.theme=e.target.value; state.limit=30; draw(); };
  $("#f-sit", el).onchange = e => { state.sit=e.target.value; state.limit=30; draw(); };
  $("#f-term", el).onchange = e => { state.term=e.target.value; state.limit=30; draw(); };
}

/* --- Écran : Infos --- */
function screenInfo(el){
  el.innerHTML = `<h1 class="large">Infos</h1><div class="info">
  <h2>Ce que fait l'application</h2>
  <p>Elle présente des gestes de la Sunnah et renvoie aux hadiths qui les rapportent. Elle <b>ne rend pas de fatwa</b> : pour une question de jurisprudence, consultez un savant qualifié.</p>
  <h2>Contenu</h2>
  <ul><li>Les 40 hadiths d'An-Nawawi (arabe et français)</li><li>Riyad as-Salihin, Ash-Shama'il, Al-Adab al-Mufrad (arabe ; français seulement pour les hadiths cités dans les fiches)</li></ul>
  <h2>Ce qui est en cours de relecture</h2>
  <ul><li>Les résumés des fiches, les thèmes, les définitions du lexique.</li><li>Les traductions marquées « traduction automatique » : rédigées par une IA, à relire par une personne qualifiée.</li></ul>
  <h2>Degrés d'authenticité</h2>
  <p>Ils ne sont jamais inventés. Ils sont lus dans la mention finale du texte (par exemple « rapporté par Boukhari et Mouslim » ou l'avis d'An-Nawawi) ; sinon : « non renseigné ». Ce n'est pas un classement indépendant par un savant nommé.</p>
  <h2>Sources et licences</h2>

/* --- Navigation par hash --- */
function route(){
  const h = location.hash || "#/";
  const el = $("#screen");
  scrolls[el.dataset.route] = scrollY;
  el.dataset.route = h;
  const m = h.match(/^#\/p\/([\w-]+)$/), mc = h.match(/^#\/c\/([\w-]+)$/);
  el.className = "enter";
  $("#t-home").removeAttribute("aria-current"); $("#t-h").removeAttribute("aria-current"); $("#t-i").removeAttribute("aria-current");
  if (m) { screenPractice(el, m[1]); $("#t-home").setAttribute("aria-current","page"); }
  else if (mc) { screenCategory(el, mc[1]); $("#t-home").setAttribute("aria-current","page"); }
  else if (h === "#/h") { screenHadiths(el); $("#t-h").setAttribute("aria-current","page"); }
  else if (h === "#/i") { screenInfo(el); $("#t-i").setAttribute("aria-current","page"); }
  else { screenHome(el); $("#t-home").setAttribute("aria-current","page"); }
  scrollTo(0, scrolls[h] || 0);
}
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { location.hash = g.dataset.go; return; }
  if (e.target.closest("[data-back]")) { history.length > 1 ? history.back() : (location.hash = "#/"); }
});
window.addEventListener("hashchange", route);
fetch("data.json").then(r=>r.json()).then(d=>{
  d.hadiths.forEach(h=>{ h._ar = arNorm(h.arabic); h._fr = frNorm(h.french); h._stems = new Set(arTokens(h.arabic).map(stem)); });
  D = d; byKey = new Map(d.hadiths.map(h=>[h.collection+":"+h.number, h]));
  route();
});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
